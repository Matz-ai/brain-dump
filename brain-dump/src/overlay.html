<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        padding: 0 8px;
      }
      .pill {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(30, 30, 30, 0.85);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #ddd;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.2px;
        white-space: nowrap;
        transition: background 0.25s ease, border-color 0.25s ease, color 0.25s ease, transform 0.25s ease, outline-color 0.2s ease;
        outline: 2px dashed transparent;
        outline-offset: 3px;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #666;
        box-shadow: 0 0 0 0 transparent;
        transition: background 0.25s ease, box-shadow 0.25s ease;
      }
      .pill.ready { opacity: 0.55; }
      .pill.ready .dot { background: #4caf50; }

      .pill.recording {
        background: rgba(244, 67, 54, 0.95);
        border-color: rgba(244, 67, 54, 0.6);
        color: #fff;
        animation: pulse 1.0s ease-in-out infinite;
      }
      .pill.recording .dot {
        background: #fff;
        box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.25);
      }

      .pill.transcribing {
        background: rgba(255, 152, 0, 0.95);
        border-color: rgba(255, 152, 0, 0.6);
        color: #fff;
      }
      .pill.transcribing .dot {
        background: #fff;
        animation: spin 1s linear infinite;
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-top-color: transparent;
        box-sizing: border-box;
      }

      .pill.pasted {
        background: rgba(76, 175, 80, 0.95);
        border-color: rgba(76, 175, 80, 0.6);
        color: #fff;
        transform: scale(1.05);
      }
      .pill.pasted .dot { background: #fff; }

      .pill.failed {
        background: rgba(120, 30, 30, 0.95);
        border-color: rgba(244, 67, 54, 0.4);
        color: #fff;
      }
      .pill.failed .dot { background: #ff5252; }

      .pill.repositioning {
        outline-color: #4a9eff;
        opacity: 1;
        cursor: grab;
        animation: dashFlow 1s linear infinite;
      }
      .pill.repositioning:active { cursor: grabbing; }

      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.04); }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes dashFlow {
        from { outline-offset: 3px; }
        to { outline-offset: 6px; }
      }
    </style>
  </head>
  <body>
    <div class="pill ready" id="pill" data-tauri-drag-region>
      <span class="dot" id="dot"></span>
      <span id="label">Prêt</span>
    </div>

    <script type="module">
      import { getCurrentWindow, PhysicalPosition } from "https://esm.sh/@tauri-apps/api@2/window";
      import { listen } from "https://esm.sh/@tauri-apps/api@2/event";

      const appWindow = getCurrentWindow();
      const pill = document.getElementById("pill");
      const label = document.getElementById("label");

      // Always click-through (the tray icon is the control surface).
      appWindow.setIgnoreCursorEvents(true);

      // Restore saved position
      try {
        const savedPos = localStorage.getItem("overlay-pos");
        if (savedPos) {
          const { x, y } = JSON.parse(savedPos);
          appWindow.setPosition(new PhysicalPosition(x, y));
        }
      } catch {}

      // Persist position on every move
      appWindow.onMoved((event) => {
        try {
          const { x, y } = event.payload;
          localStorage.setItem("overlay-pos", JSON.stringify({ x, y }));
        } catch {}
      });

      // ---- Reposition mode (triggered from tray menu) ----
      let repositionActive = false;
      let repositionTimer = null;
      const REPOSITION_TIMEOUT_MS = 10000;

      async function enterReposition() {
        repositionActive = true;
        pill.classList.add("repositioning");
        await appWindow.setIgnoreCursorEvents(false);
        if (repositionTimer) clearTimeout(repositionTimer);
        repositionTimer = setTimeout(exitReposition, REPOSITION_TIMEOUT_MS);
      }

      async function exitReposition() {
        if (!repositionActive) return;
        repositionActive = false;
        pill.classList.remove("repositioning");
        if (repositionTimer) {
          clearTimeout(repositionTimer);
          repositionTimer = null;
        }
        await appWindow.setIgnoreCursorEvents(true);
      }

      listen("start-reposition", () => enterReposition());

      // After the user drags, exit reposition shortly after mouseup.
      window.addEventListener("mouseup", () => {
        if (repositionActive) setTimeout(exitReposition, 400);
      });

      // ---- State management ----
      const STATE_CLASSES = ["ready", "recording", "transcribing", "pasted", "failed"];
      let pasteTimer = null;

      function setState(cls, text) {
        for (const c of STATE_CLASSES) pill.classList.remove(c);
        pill.classList.add(cls);
        label.textContent = text;
      }

      function flashPasted() {
        if (pasteTimer) clearTimeout(pasteTimer);
        setState("pasted", "✓ Collé");
        pasteTimer = setTimeout(() => setState("ready", "Prêt"), 1800);
      }
      function flashFailed() {
        if (pasteTimer) clearTimeout(pasteTimer);
        setState("failed", "✗ Échec");
        pasteTimer = setTimeout(() => setState("ready", "Prêt"), 2500);
      }

      listen("recording-state", (event) => {
        const s = event.payload;
        if (s === "Recording") setState("recording", "● REC");
        else if (s === "Transcribing") setState("transcribing", "Transcrit…");
        else if (
          s === "Ready" &&
          !pill.classList.contains("pasted") &&
          !pill.classList.contains("failed")
        ) {
          setState("ready", "Prêt");
        }
      });

      listen("paste-done", () => flashPasted());
      listen("paste-failed", () => flashFailed());
    </script>
  </body>
</html>
