<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        font-family: "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        padding: 0 8px;
      }
      .pill {
        --tint: 255, 255, 255;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 30px;
        padding: 0 13px 0 11px;
        border-radius: 999px;
        background: rgba(18, 18, 22, 0.88);
        border: 1px solid rgba(var(--tint), 0.16);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        color: #e8e8ec;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.1px;
        white-space: nowrap;
        transition: background 0.25s ease, border-color 0.25s ease, opacity 0.25s ease, transform 0.25s ease, outline-color 0.2s ease;
        outline: 2px dashed transparent;
        outline-offset: 3px;
      }
      .icon {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2px;
        width: 14px;
        height: 14px;
      }
      .icon span {
        display: none;
        width: 2.5px;
        border-radius: 2px;
        background: rgb(var(--tint));
      }
      .icon::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgb(var(--tint));
      }

      .pill.ready { --tint: 74, 222, 128; opacity: 0.6; }
      .pill.ready #label { color: #b8b8c0; font-weight: 500; }

      .pill.recording {
        --tint: 255, 90, 95;
        background: rgba(40, 12, 14, 0.92);
        border-color: rgba(255, 90, 95, 0.55);
      }
      /* Little live equalizer while recording */
      .pill.recording .icon::before { display: none; }
      .pill.recording .icon span { display: block; animation: eq 0.9s ease-in-out infinite; }
      .pill.recording .icon span:nth-child(2) { animation-delay: -0.3s; }
      .pill.recording .icon span:nth-child(3) { animation-delay: -0.6s; }

      .pill.transcribing { --tint: 251, 191, 36; }
      .pill.transcribing .icon::before {
        width: 11px;
        height: 11px;
        background: transparent;
        border: 2px solid rgba(var(--tint), 0.3);
        border-top-color: rgb(var(--tint));
        animation: spin 0.8s linear infinite;
      }

      /* Mode commande : même animation, teinte violette */
      .pill.cmd {
        --tint: 167, 139, 250;
        background: rgba(26, 18, 46, 0.92);
        border-color: rgba(167, 139, 250, 0.55);
      }

      .pill.pasted {
        --tint: 74, 222, 128;
        background: rgba(10, 36, 20, 0.92);
        border-color: rgba(74, 222, 128, 0.5);
        transform: scale(1.04);
      }
      .pill.empty { --tint: 160, 160, 170; }
      .pill.failed {
        --tint: 255, 90, 95;
        background: rgba(40, 12, 14, 0.92);
        border-color: rgba(255, 90, 95, 0.45);
      }

      .pill.repositioning {
        outline-color: #7c8cff;
        opacity: 1;
        cursor: grab;
        animation: dashFlow 1s linear infinite;
      }
      .pill.repositioning:active { cursor: grabbing; }

      @keyframes eq {
        0%, 100% { height: 4px; }
        50% { height: 13px; }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes dashFlow {
        from { outline-offset: 3px; }
        to { outline-offset: 6px; }
      }
    </style>
  </head>
  <body>
    <div class="pill ready" id="pill" data-tauri-drag-region>
      <span class="icon"><span></span><span></span><span></span></span>
      <span id="label">Prêt</span>
    </div>

    <script>
      // Tauri API is injected globally (withGlobalTauri) — no network import needed.
      const { getCurrentWindow } = window.__TAURI__.window;
      const { PhysicalPosition, PhysicalSize } = window.__TAURI__.dpi;
      const { listen } = window.__TAURI__.event;

      const appWindow = getCurrentWindow();
      const pill = document.getElementById("pill");
      const label = document.getElementById("label");

      // Always click-through (the main window is the control surface).
      // Position is saved/restored by the Rust side, which also keeps it on a connected screen.
      appWindow.setIgnoreCursorEvents(true);

      // ---- Reposition mode (triggered from the main window) ----
      let repositionActive = false;
      let repositionTimer = null;
      const REPOSITION_TIMEOUT_MS = 10000;

      async function enterReposition() {
        repositionActive = true;
        pill.classList.add("repositioning");
        await appWindow.setIgnoreCursorEvents(false);
        if (repositionTimer) clearTimeout(repositionTimer);
        repositionTimer = setTimeout(exitReposition, REPOSITION_TIMEOUT_MS);
      }

      async function exitReposition() {
        if (!repositionActive) return;
        repositionActive = false;
        pill.classList.remove("repositioning");
        if (repositionTimer) {
          clearTimeout(repositionTimer);
          repositionTimer = null;
        }
        await appWindow.setIgnoreCursorEvents(true);
      }

      listen("start-reposition", () => enterReposition());

      // After the user drags, exit reposition shortly after mouseup.
      window.addEventListener("mouseup", () => {
        if (repositionActive) setTimeout(exitReposition, 400);
      });

      // ---- State management ----
      const STATE_CLASSES = ["ready", "recording", "transcribing", "pasted", "empty", "failed"];
      const FLASH_CLASSES = ["pasted", "empty", "failed"];
      let flashTimer = null;
      let commandMode = false;

      // Long messages (command errors) don't fit in the window: widen it around its center while shown.
      let savedGeometry = null;

      async function fitWindowToPill() {
        const needed = pill.offsetWidth + 16;
        if (needed <= window.innerWidth) return;
        const scale = await appWindow.scaleFactor();
        const pos = await appWindow.outerPosition();
        const size = await appWindow.outerSize();
        savedGeometry = { pos, size };
        const width = Math.ceil(needed * scale);
        const dx = Math.round((width - size.width) / 2);
        await appWindow.setPosition(new PhysicalPosition(pos.x - dx, pos.y));
        await appWindow.setSize(new PhysicalSize(width, size.height));
      }

      async function restoreWindow() {
        if (!savedGeometry) return;
        const { pos, size } = savedGeometry;
        savedGeometry = null;
        await appWindow.setSize(size);
        await appWindow.setPosition(pos);
      }

      function setState(cls, text, cmd = false) {
        restoreWindow();
        for (const c of STATE_CLASSES) pill.classList.remove(c);
        pill.classList.add(cls);
        pill.classList.toggle("cmd", cmd);
        label.textContent = text;
      }

      function flash(cls, text, ms) {
        if (flashTimer) clearTimeout(flashTimer);
        setState(cls, text);
        flashTimer = setTimeout(() => setState("ready", "Prêt"), ms);
      }

      listen("recording-mode", (event) => {
        commandMode = event.payload === "command";
      });

      listen("recording-state", (event) => {
        const s = event.payload;
        if (s === "Recording") setState("recording", commandMode ? "Commande…" : "J'écoute…", commandMode);
        else if (s === "Transcribing") setState("transcribing", commandMode ? "Commande…" : "Transcription…", commandMode);
        else if (s === "Ready" && !FLASH_CLASSES.some((c) => pill.classList.contains(c))) {
          setState("ready", "Prêt");
        }
      });

      listen("paste-done", () => flash("pasted", "✓ Collé", 1800));
      listen("nothing-heard", () => flash("empty", "Rien entendu", 1800));
      listen("paste-failed", () => flash("failed", "✗ Échec", 2500));
      listen("transcription-failed", (event) => {
        // event.payload : l'audio a bien été gardé pour « Réessayer »
        flash("failed", event.payload ? "✗ Échec, dictée gardée" : "✗ Échec", 4500);
        fitWindowToPill();
      });
      listen("command-failed", (event) => {
        flash("failed", `✗ ${event.payload}`, 4500);
        fitWindowToPill();
      });
    </script>
  </body>
</html>
